<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A special place for our most cherished memories — built with love, just for you." />
    <title>For my baby ♡</title>
    <!-- Google Fonts: Outfit + Playfair Display for elegant contrast -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap"
      rel="stylesheet"
    />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css" />
    <!-- Tailwind CSS v4 CDN -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @theme {
        /* Premium rose/pink color palette — warm, romantic tones */
        --color-rose-50: oklch(97.4% 0.012 350);
        --color-rose-100: oklch(94.1% 0.028 350);
        --color-rose-200: oklch(89.5% 0.055 350);
        --color-rose-300: oklch(82% 0.09 350);
        --color-rose-400: oklch(73% 0.14 350);
        --color-rose-500: oklch(65% 0.18 350);
        --color-rose-600: oklch(57% 0.2 350);
        --color-rose-700: oklch(49% 0.2 350);
        --color-rose-800: oklch(41% 0.17 350);
        --color-rose-900: oklch(30% 0.1 350);

        --color-blush-50: oklch(97% 0.015 10);
        --color-blush-100: oklch(93% 0.03 10);
        --color-blush-200: oklch(87% 0.06 10);

        --font-outfit: "Outfit", sans-serif;
        --font-playfair: "Playfair Display", serif;
      }

      body {
        font-family: var(--font-outfit);
        background-color: var(--bg-primary);
        color: var(--text-primary);
        overflow-x: hidden;
        transition: background-color 0.5s ease, color 0.5s ease;
      }
    </style>
  </head>
  <body
    class="antialiased min-h-screen flex flex-col items-center relative transition-colors duration-500"
  >
    <!-- Ambient Particle Canvas -->
    <canvas id="particle-canvas" class="fixed inset-0 z-[1] pointer-events-none"></canvas>

    <!-- Floating Pink Flower Petals Canvas -->
    <canvas id="petal-canvas" class="fixed inset-0 z-[2] pointer-events-none"></canvas>

    <!-- Dynamic Video Background -->
    <div id="video-bg" class="fixed inset-0 overflow-hidden pointer-events-none z-[0]">
      <video
        autoplay
        loop
        muted
        playsinline
        class="absolute inset-0 w-full h-full object-cover opacity-30"
      >
        <source src="liveBG/pink.mp4" type="video/mp4" />
      </video>
      <!-- Rose-tinted overlay to blend with the theme -->
      <div id="video-overlay" class="absolute inset-0" style="background: linear-gradient(to bottom, var(--bg-video-overlay-from), var(--bg-video-overlay-via), var(--bg-video-overlay-to)); transition: background 0.5s ease;"></div>
    </div>

    <!-- Entrance Overlay: Premium entrance gate -->
    <div
      id="entrance-overlay"
      class="fixed inset-0 z-50 flex items-center justify-center transition-opacity duration-1000"
      style="background-color: var(--bg-entrance);"
    >
      <div class="flex flex-col items-center gap-8">
        <!-- Floating hearts decoration -->
        <div class="relative w-32 h-32 flex items-center justify-center">
          <div class="absolute inset-0 bg-rose-500/20 rounded-full blur-3xl animate-pulse"></div>
          <div class="absolute w-20 h-20 bg-rose-500/10 rounded-full blur-2xl animate-blob"></div>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="48"
            height="48"
            viewBox="0 0 24 24"
            fill="currentColor"
            class="text-rose-400 heart-beat relative z-10 drop-shadow-[0_0_20px_rgba(244,63,94,0.5)]"
          >
            <path
              d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
            />
          </svg>
        </div>
        <button
          id="enter-btn"
          class="group relative px-10 py-5 bg-gradient-to-r from-rose-500/20 to-rose-400/20 backdrop-blur-xl rounded-2xl shadow-[0_0_40px_rgba(244,63,94,0.15)] border border-rose-400/30 text-rose-500 font-semibold text-xl tracking-wider overflow-hidden transition-all duration-500 hover:shadow-[0_0_60px_rgba(244,63,94,0.3)] hover:scale-105 hover:border-rose-400/60 active:scale-95"
        >
          <span class="relative z-10 flex items-center gap-3">
            <span class="font-playfair italic">Hiiiii</span>
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="transition-transform group-hover:translate-x-1">
              <path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>
            </svg>
          </span>
          <div
            class="absolute inset-0 bg-gradient-to-r from-rose-500/30 to-rose-400/30 scale-x-0 origin-left transition-transform duration-500 ease-out group-hover:scale-x-100 z-0"
          ></div>
        </button>
        <p class="text-rose-400/50 text-sm tracking-widest uppercase font-light animate-pulse">Click to enter</p>
      </div>
    </div>

    <!-- Global Audio Player -->
    <audio id="bg-music" loop>
      <source src="music/tahanan.mp3" type="audio/mpeg" />
    </audio>

    <!-- Floating Navigation Menu -->
    <nav
      id="main-nav"
      class="fixed bottom-6 inset-x-0 z-40 flex justify-center opacity-0 transform translate-y-10 transition-all duration-1000"
    >
      <div
        id="nav-inner"
        class="flex items-center gap-1 sm:gap-2 p-1.5 sm:p-2 backdrop-blur-2xl rounded-full max-w-[95vw] whitespace-nowrap overflow-visible"
        style="background: var(--bg-nav); box-shadow: 0 8px 40px var(--bg-nav-shadow); border: 1px solid var(--border-subtle);"
      >
        <button
          data-route="home"
          class="nav-btn group relative px-4 sm:px-6 py-2.5 rounded-full text-xs sm:text-sm font-medium transition-all duration-300 flex items-center gap-2"
          style="color: var(--text-muted);"
        >
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="relative z-10 sm:w-4 sm:h-4"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span class="relative z-10 hidden sm:inline">Home</span>
        </button>
        <button
          data-route="gallery"
          class="nav-btn group relative px-4 sm:px-6 py-2.5 rounded-full text-xs sm:text-sm font-medium transition-all duration-300 flex items-center gap-2"
          style="color: var(--text-muted);"
        >
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="relative z-10 sm:w-4 sm:h-4"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
          <span class="relative z-10 hidden sm:inline">Gallery</span>
        </button>
        <button
          data-route="interactive"
          class="nav-btn group relative px-4 sm:px-6 py-2.5 rounded-full text-xs sm:text-sm font-medium transition-all duration-300 flex items-center gap-2"
          style="color: var(--text-muted);"
        >
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="relative z-10 sm:w-4 sm:h-4"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span class="relative z-10 hidden sm:inline">Messages</span>
        </button>

        <div class="w-px h-6 mx-1" style="background: var(--border-subtle);"></div>

        <!-- Theme Toggle -->
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle Light/Dark Mode">
          <!-- Sun icon (shown in dark mode) -->
          <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-heading);">
            <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
          <!-- Moon icon (shown in light mode) -->
          <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-heading);">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>

        <div class="w-px h-6 mx-1" style="background: var(--border-subtle);"></div>

        <!-- Audio Controls -->
        <div class="flex items-center gap-2 relative">
          <!-- Custom Music Dropdown -->
          <div class="relative">
            <button id="music-dropdown-btn" class="flex items-center gap-2 bg-rose-500/10 font-semibold text-xs sm:text-sm rounded-full px-4 py-2.5 hover:bg-rose-500/20 hover:shadow-[0_0_20px_rgba(244,63,94,0.1)] transition-all" style="color: var(--text-heading); border: 1px solid var(--border-subtle);">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
              <span id="current-song-label" class="hidden sm:inline">Tahanan</span>
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="opacity-70"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div id="music-dropdown-menu" class="absolute bottom-full mb-3 right-0 backdrop-blur-2xl rounded-2xl p-2 w-56 opacity-0 pointer-events-none translate-y-4 transition-all duration-300 flex flex-col gap-1" style="background: var(--dropdown-bg); border: 1px solid var(--border-subtle); box-shadow: 0 10px 40px rgba(244,63,94,0.15);">
              <button class="music-option w-full text-left px-4 py-2.5 text-sm hover:bg-rose-500/10 rounded-xl transition-all font-medium flex items-center justify-between" data-src="music/tahanan.mp3" data-label="Tahanan" style="color: var(--music-option-text);">
                Tahanan
                <svg class="w-4 h-4 text-rose-400 opacity-100 transition-opacity" data-icon xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
              </button>
              <button class="music-option w-full text-left px-4 py-2.5 text-sm hover:bg-rose-500/10 rounded-xl transition-all font-medium flex items-center justify-between" data-src="music/tibo.mp3" data-label="Titibo-tibo" style="color: var(--music-option-text);">
                Titibo-tibo
                <svg class="w-4 h-4 text-rose-400 opacity-0 transition-opacity" data-icon xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
              </button>
              <button class="music-option w-full text-left px-4 py-2.5 text-sm hover:bg-rose-500/10 rounded-xl transition-all font-medium flex items-center justify-between" data-src="music/pray.mp3" data-label="I Pray" style="color: var(--music-option-text);">
                I Pray
                <svg class="w-4 h-4 text-rose-400 opacity-0 transition-opacity" data-icon xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
              </button>
              <button class="music-option w-full text-left px-4 py-2.5 text-sm hover:bg-rose-500/10 rounded-xl transition-all font-medium flex items-center justify-between" data-src="music/lover.mp3" data-label="Lover" style="color: var(--music-option-text);">
                Lover
                <svg class="w-4 h-4 text-rose-400 opacity-0 transition-opacity" data-icon xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
              </button>
              <button class="music-option w-full text-left px-4 py-2.5 text-sm hover:bg-rose-500/10 rounded-xl transition-all font-medium flex items-center justify-between" data-src="music/xmas.mp3" data-label="All I Want For Christmas Is You" style="color: var(--music-option-text);">
                All I Want For Christmas Is You
                <svg class="w-4 h-4 text-rose-400 opacity-0 transition-opacity" data-icon xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
              </button>
            </div>
          </div>
          <button
            id="audio-toggle"
            class="w-10 h-10 rounded-full bg-rose-500/10 flex items-center justify-center text-rose-400 transition-all duration-300 hover:scale-110 hover:bg-rose-500/20 hover:shadow-[0_0_20px_rgba(244,63,94,0.15)] active:scale-95 shrink-0"
            style="border: 1px solid var(--border-subtle);"
            aria-label="Toggle Audio"
          >
            <svg
              id="icon-pause"
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="currentColor"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="6" y="4" width="4" height="16" />
              <rect x="14" y="4" width="4" height="16" />
            </svg>
            <svg
              id="icon-play"
              class="hidden translate-x-[2px]"
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="currentColor"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polygon points="5 3 19 12 5 21 5 3" />
            </svg>
          </button>
        </div>
      </div>
    </nav>

    <!-- Main Content Container -->
    <main
      id="app-content"
      class="w-full max-w-6xl px-6 py-12 flex-1 flex flex-col z-10 opacity-0 transition-opacity duration-500 ease-in-out"
    >
      <!-- Content loaded from views/*.js goes here... -->
    </main>

    <!-- Load App Logic -->
    <script type="module" src="js/main.js"></script>
  </body>
</html>
